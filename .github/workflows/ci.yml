name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The site runs the committed bundle, so it must match the source.
      - run: npm run site
      - name: Site bundle is up to date
        run: git diff --exit-code -- docs/officeView.js docs/siteData.js || (echo "::error::Run npm run site and commit docs/officeView.js and docs/siteData.js" && exit 1)
