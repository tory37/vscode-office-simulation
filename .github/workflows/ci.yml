name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The site runs the committed bundle, and hosts copy the committed API types, so both must match the source.
      - run: npm run site
      - name: Site bundle and API types are up to date
        run: git diff --exit-code -- docs/officeView.js docs/siteData.js api/ || (echo "::error::Run npm run site and commit docs/ and api/" && exit 1)
